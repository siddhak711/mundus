[project]
name = "mundus-world"
version = "0.1.0"
description = "Mundus world context layer: ingestion, storage, World API (REST + MCP)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "numpy>=1.26",
  "pillow>=10",
  "shapely>=2.0",
  "mcp>=1.9",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
embed = ["fastembed>=0.5"]

[project.scripts]
mundus = "mundus_world.runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mundus_world"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
