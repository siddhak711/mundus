# Claim predicate vocabulary. One source for the backend validator and the harness claims skill.
# type: number | string | boolean | object. multi: true means many values may coexist (never conflicts).
# exact: true means numbers must match exactly (years, counts); other numbers within 5% are the same fact.
# Namespaces note.* and synthesis.* are free-form and never conflict; they are not listed here.
market.building_type: {type: string}
market.building_area_sqft: {type: number, unit: sqft}
market.year_built: {type: number, exact: true}
market.stories: {type: number, exact: true}
market.asking_rent: {type: number, unit: usd_per_sqft_per_year}
market.available_area_sqft: {type: number, unit: sqft}
market.listing_status: {type: string}
market.tenant_count: {type: number, exact: true}
market.largest_tenant: {type: string}
market.lease_term_months: {type: number, unit: months, exact: true}
market.last_sale_price: {type: number, unit: usd}
market.last_sale_date: {type: string}
market.nearby_sale_comp: {type: object, multi: true}
market.asking_price: {type: number, unit: usd}
market.units_available: {type: number, exact: true}
market.min_rent: {type: number, unit: usd_per_month}
market.max_rent: {type: number, unit: usd_per_month}
market.home_list_price: {type: number, unit: usd}
market.home_bedrooms: {type: number, exact: true}
market.home_bathrooms: {type: number, exact: true}
interior.space_kind: {type: string}
interior.floor_area_m2: {type: number, unit: m2}
interior.room_count: {type: number, exact: true}
interior.ceiling_height_m: {type: number, unit: m}
interior.largest_room_area_m2: {type: number, unit: m2}
interior.capacity_estimate: {type: number}
interior.natural_light: {type: string}
interior.condition: {type: string}
interior.furnished: {type: boolean}
interior.amenity_present: {type: string, multi: true}
interior.layout_note: {type: string, multi: true}
interior.adjacent_room: {type: string, multi: true}
aerial.footprint_area_m2: {type: number, unit: m2}
aerial.parcel_area_m2: {type: number, unit: m2}
aerial.roof_material: {type: string}
aerial.roof_condition: {type: string}
aerial.has_pool: {type: boolean}
aerial.has_solar: {type: boolean}
aerial.tree_cover_pct: {type: number, unit: pct}
aerial.parking_visible: {type: string}
aerial.loading_access: {type: string}
aerial.vehicle_count: {type: number, exact: true}
surroundings.nearby_feature: {type: string, multi: true}
surroundings.street_frontage: {type: string}
pano.caption: {type: string, multi: true}
