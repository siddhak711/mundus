<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversion review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..110,400..700&display=swap" rel="stylesheet">
<style>
  :root{--surface:#fff;--wash:#f1f3f5;--ink:#17212b;--muted:#5d6975;--faint:#8a95a1;--rule:#d8dde2;--link:#1d4fd7;--ok:#1c8a68;--warn:#b26b00;--bad:#c2410c;
    --oak:#e6d3b8;--tile:#cfd8de;--corr:#c9c6c0;--core:#e3e1dd;--bar:#3d5a80;--bar2:#98a6b8;
    font-family:"Archivo",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;color:var(--ink);font-variant-numeric:tabular-nums}
  *{box-sizing:border-box} body{margin:0;background:var(--wash)} [hidden]{display:none!important}
  h1,h2,h3,p,ol,ul,dl,dd{margin:0;padding:0} ul,ol{list-style:none} a{color:var(--link)}
  :focus-visible{outline:2px solid var(--link);outline-offset:2px}
  @view-transition{navigation:auto} ::view-transition-new(root){animation:380ms cubic-bezier(.2,0,0,1) both rv-in} @keyframes rv-in{from{opacity:0}}
  @media (prefers-reduced-motion:reduce){::view-transition-new(root),::view-transition-old(root){animation:none}}
  .top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:16px;height:56px;padding:0 28px;background:var(--surface);border-bottom:1px solid var(--rule)}
  .top .back{font-size:13px;text-decoration:none} .top .title{font-weight:700;font-stretch:82%;font-size:18px}
  .top .spacer{flex:1}
  .btn{border:1px solid var(--ink);background:var(--surface);border-radius:7px;padding:7px 14px;font:inherit;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink);text-decoration:none}
  .btn.primary{background:var(--ink);color:#fff}
  main{max-width:1180px;margin:0 auto;padding:28px 28px 64px;display:grid;gap:22px}
  .hero{display:grid;gap:6px} .eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .hero h1{font-size:34px;line-height:1.08;font-weight:700;font-stretch:80%} .hero .sub{color:var(--muted)}
  .verdict{margin-top:8px;padding:12px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--warn)}
  .verdict.good{border-left-color:var(--ok)}
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
  .kpi{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
  .kpi dt{font-size:12px;color:var(--muted)} .kpi dd{font-size:24px;font-weight:650;font-stretch:85%;line-height:1.15;margin-top:2px} .kpi .note{font-size:12px;color:var(--muted)}
  .card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:20px 22px;scroll-margin-top:72px}
  .card>h2{font-size:18px;font-weight:650;font-stretch:88%;display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .card>h2 .tag{font-size:12px;font-weight:600;color:var(--muted);font-stretch:100%}
  .card>.lede{color:var(--muted);margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:22px} .grid2>*{min-width:0}
  table{width:100%;border-collapse:collapse;font-size:13px} th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--rule)}
  td{padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top} td.num{text-align:right;white-space:nowrap} tr:last-child td{border-bottom:0}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .pill.ok{background:#e3f3ec;color:var(--ok)} .pill.flag{background:#fdf0dc;color:var(--warn)} .pill.bad{background:#fde7de;color:var(--bad)} .pill.na{background:var(--wash);color:var(--muted)}
  .meter{height:6px;border-radius:3px;background:var(--wash);overflow:hidden;min-width:60px} .meter i{display:block;height:100%;background:var(--ok)} .meter i.part{background:var(--warn)}
  .rows{display:grid} .rows>div{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--rule)} .rows>div:last-child{border-bottom:0}
  .rows span:first-child{color:var(--muted)} .rows span:last-child{font-weight:600;text-align:right}
  .bars{display:grid;gap:9px} .bar{display:grid;grid-template-columns:170px 1fr 92px;gap:10px;align-items:center;font-size:13px}
  .bar .track{height:16px;background:var(--wash);border-radius:3px;position:relative} .bar .fill{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--bar)}
  .bar .fill.neg{background:var(--bar2)} .bar .v{text-align:right;font-weight:600} .bar .k{color:var(--muted)}
  .bar.total .k{color:var(--ink);font-weight:600}
  .plan svg{width:100%;height:auto;display:block;background:#fafafa;border:1px solid var(--rule);border-radius:8px}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:8px} .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.08)}
  .units-table{max-height:420px;overflow:auto}
  .list{display:grid;gap:8px} .list li{padding-left:18px;position:relative} .list li::before{content:"";position:absolute;left:4px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--warn)}
  .muted{color:var(--muted)} .small{font-size:12.5px}
  .error{max-width:640px;margin:80px auto;padding:24px;background:var(--surface);border:1px solid var(--rule);border-radius:12px}
  @media (max-width:980px){.kpis{grid-template-columns:repeat(3,1fr)} .grid2{grid-template-columns:1fr}}
  @media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)} main{padding:18px 16px 48px} .top{padding:0 16px} .bar{grid-template-columns:110px 1fr 74px}}
  @media print{.top .btn,.top .back{display:none} body{background:#fff} .card,.kpi{break-inside:avoid;border-color:#ccc} .units-table{max-height:none;overflow:visible} main{padding:0}}
</style>
</head><body>
<header class="top">
  <a class="back" id="back" href="./">&larr; Back to the floor</a>
  <span class="title" id="top-title">Conversion review</span>
  <span class="spacer"></span>
  <button type="button" class="btn" id="dl">Download layout</button>
  <button type="button" class="btn primary" id="send">Send to architect</button>
</header>
<main id="main" aria-live="polite"><p class="muted">Loading the agents' work…</p></main>
<script type="module" src="./js/review.js"></script>
</body></html>
