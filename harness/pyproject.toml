[project]
name = "mundus-harness"
version = "0.1.0"
description = "Mundus agent layer: a deepagents harness over the World API"
requires-python = ">=3.11"
dependencies = [
  "deepagents==0.7.38",
  "langchain==1.5.0",
  "langgraph==1.2.22",
  "langgraph-sdk==0.4.14",
  "langchain-mcp-adapters==0.3.2",
  "langchain-anthropic==1.7.10",
  "langsmith==0.14.17",
  "httpx>=0.27",
  "pillow>=10",
  "pyyaml>=6",
  "python-dotenv>=1.0",
  "sqlglot>=25",
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
serve = ["langgraph-cli[inmem]==0.4.43"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mundus_harness"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
