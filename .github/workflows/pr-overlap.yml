name: PR overlap check

# Compares this PR's claimed files (the "## Files" section of its body) and changed files against every other
# open PR, then posts or refreshes one comment listing the overlaps. See AGENTS.md, section 2.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-overlap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  overlap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const me = context.payload.pull_request.number;
            const MARKER = '<!-- pr-overlap-check -->';

            // Backticked paths under the "## Files" heading of a PR body.
            const claimed = (body) => {
              const m = (body || '').match(/^##\s*Files\s*$([\s\S]*?)(?=^##\s|(?![\s\S]))/m);
              if (!m) return [];
              const text = m[1].replace(/<!--[\s\S]*?-->/g, '');
              return [...text.matchAll(/`([^`\s]+)`/g)].map((x) => x[1].replace(/^\.\//, ''))
                .filter((p) => p !== 'path/to/file.py');
            };
            const changed = async (n) =>
              (await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: n, per_page: 100 }))
                .flatMap((f) => [f.filename, f.previous_filename].filter(Boolean));
            // A path ending in "/" claims everything under it.
            const hit = (a, b) => a === b || (a.endsWith('/') && b.startsWith(a)) || (b.endsWith('/') && a.startsWith(b));

            const pulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            const mine = pulls.find((p) => p.number === me) || context.payload.pull_request;
            const myPaths = [...new Set([...claimed(mine.body), ...(await changed(me))])];

            const rows = [];
            for (const p of pulls) {
              if (p.number === me) continue;
              const theirs = [...new Set([...claimed(p.body), ...(await changed(p.number))])];
              const overlap = [...new Set(myPaths.flatMap((a) => theirs.filter((b) => hit(a, b)).map((b) => a === b ? a : `${a} ~ ${b}`)))];
              if (overlap.length) {
                rows.push(`| #${p.number} ${p.title.replace(/\|/g, '\\|')} | @${p.user.login}${p.draft ? ' (draft)' : ''} | ${overlap.map((x) => '`' + x + '`').join('<br>')} |`);
              }
            }

            const noClaim = claimed(mine.body).length === 0
              ? '\n\n**This PR has no claimed files.** Fill in the `## Files` section of the description (AGENTS.md, section 1).'
              : '';
            const body = rows.length
              ? `${MARKER}\n### Possible conflicts with other open PRs\n\n| PR | Owner | Overlapping paths |\n|---|---|---|\n${rows.join('\n')}\n\nAgree on an order or split with the other owner before continuing, and record it under \`## Conflicts\` (AGENTS.md, section 2). This check sees paths only, not shared contracts.${noClaim}`
              : `${MARKER}\n### No path overlap with other open PRs\n\nChecked ${pulls.length - 1} open PR(s). Shared-contract conflicts still need a manual check (AGENTS.md, section 2).${noClaim}`;

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: me, per_page: 100 });
            const old = comments.find((c) => c.body && c.body.startsWith(MARKER));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: me, body });
