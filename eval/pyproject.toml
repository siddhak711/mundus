[project]
name = "mundus-eval"
version = "0.1.0"
description = "Evaluation runner and graders for the Census agent harness"
requires-python = ">=3.11"
dependencies = [
  "mundus-harness",
  "anthropic>=1.0",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
mundus-eval = "mundus_eval.runner:main"

[tool.uv.sources]
mundus-harness = { path = "../harness", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mundus_eval"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
