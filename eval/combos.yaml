# Harness combinations to compare. Each combination is run on every task, 3 times, interleaved.
# memory: cold  -> the claims store is emptied before every run
# memory: warm  -> the claims store is restored from the snapshot built by `mundus-eval seed` before every run
# env: environment overrides applied when the agent for this combination is built
runs_per_task: 3
combos:
  - name: cold-sonnet-hydrogen
    memory: cold
    env: {ORCH_MODEL: "anthropic:claude-sonnet-5-5", WORKER_MODEL: "google_genai:gemini-4-hydrogen"}
  - name: warm-sonnet-hydrogen
    memory: warm
    env: {ORCH_MODEL: "anthropic:claude-sonnet-5-5", WORKER_MODEL: "google_genai:gemini-4-hydrogen"}
  - name: cold-all-hydrogen
    memory: cold
    env: {ORCH_MODEL: "google_genai:gemini-4-hydrogen", WORKER_MODEL: "google_genai:gemini-4-hydrogen"}
