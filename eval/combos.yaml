# Harness combinations to compare. Each combination is run on every task, 3 times, interleaved.
# Every run starts from an empty claim memory: the runner gives each run a private one (CLAIM_SCOPE=run), so runs
# can execute in parallel and the shared memory is never touched. Comparing memory states is deferred.
# env: environment overrides applied when the agent for this combination is built
runs_per_task: 3
combos:
  - name: cold-sonnet-haiku
    memory: cold
    env: {ORCH_MODEL: "anthropic:claude-sonnet-5-5", WORKER_MODEL: "anthropic:claude-haiku-5-5"}
  - name: cold-all-haiku
    memory: cold
    env: {ORCH_MODEL: "anthropic:claude-haiku-5-5", WORKER_MODEL: "anthropic:claude-haiku-5-5"}
